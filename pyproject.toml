[project]
name = "stalecrate"
version = "0.1.0"
description = "Tell your coding agent which Rust crates changed after its training cutoff"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Mohib Shaikh", email = "mohibuddin9@gmail.com" }]
keywords = ["rust", "cargo", "coding-agent", "claude-code", "llm"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Repository = "https://github.com/MohibShaikh/stalecrate"
Issues = "https://github.com/MohibShaikh/stalecrate/issues"

[project.scripts]
stalecrate = "stalecrate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stalecrate"]
